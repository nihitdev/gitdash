name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Java 26 build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Temurin 26
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "26"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Verify wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Build and test on Linux
        if: runner.os != 'Windows'
        run: ./gradlew clean build installDist --no-daemon

      - name: Build and test on Windows
        if: runner.os == 'Windows'
        run: .\gradlew.bat clean build installDist --no-daemon

      - name: Verify Linux launcher
        if: runner.os != 'Windows'
        run: |
          build/install/gitdash/bin/gitdash --version
          build/install/gitdash/bin/gitdash --help >/dev/null

      - name: Verify Windows launcher and installer syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          .\build\install\gitdash\bin\gitdash.bat --version
          .\build\install\gitdash\bin\gitdash.bat --help | Out-Null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path .\install.ps1), [ref]$null, [ref]$errors
          )
          if ($errors.Count -gt 0) { throw ($errors | Out-String) }

      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: gitdash-distributions-${{ runner.os }}
          path: build/distributions/gitdash-*
          if-no-files-found: error
          retention-days: 14
