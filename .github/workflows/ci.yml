name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Java 26 build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Temurin 26
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "26"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Verify wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Build and test on Unix
        if: runner.os != 'Windows'
        run: ./gradlew clean build installDist --no-daemon

      - name: Build Windows distribution
        if: runner.os == 'Windows'
        run: .\gradlew.bat clean test --tests dev.nihit.gitdash.git.WindowsGitIntegrationTest assemble installDist --no-daemon

      - name: Verify Unix launcher
        if: runner.os != 'Windows'
        run: |
          build/install/gitdash/bin/gitdash --version
          build/install/gitdash/bin/gitdash --help >/dev/null

      - name: Verify Bash completion
        if: runner.os == 'Linux'
        run: build/install/gitdash/bin/gitdash completion bash | bash -n

      - name: Verify zsh completion
        if: runner.os == 'macOS'
        run: build/install/gitdash/bin/gitdash completion zsh | zsh -n

      - name: Test Unix installer lifecycle
        if: runner.os != 'Windows'
        run: |
          PREFIX="$RUNNER_TEMP/gitdash-install" ./install.sh install
          "$RUNNER_TEMP/gitdash-install/bin/gitdash" --version
          PREFIX="$RUNNER_TEMP/gitdash-install" ./install.sh uninstall
          test ! -e "$RUNNER_TEMP/gitdash-install/bin/gitdash"

      - name: Verify Windows launcher and installer syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          .\build\install\gitdash\bin\gitdash.bat --version
          .\build\install\gitdash\bin\gitdash.bat --help | Out-Null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path .\install.ps1), [ref]$null, [ref]$errors
          )
          if ($errors.Count -gt 0) { throw ($errors | Out-String) }
          .\build\install\gitdash\bin\gitdash.bat completion powershell | Set-Content completion.ps1
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path .\completion.ps1), [ref]$null, [ref]$errors
          )
          if ($errors.Count -gt 0) { throw ($errors | Out-String) }

      - name: Test public Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $prefix = Join-Path $env:RUNNER_TEMP "gitdash-installer-test"
          .\install.ps1 -Prefix $prefix -Version 0.1.0 -NoPath
          & (Join-Path $prefix "bin\gitdash.cmd") --version

      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: gitdash-distributions-${{ runner.os }}
          path: build/distributions/gitdash-*
          if-no-files-found: error
          retention-days: 14
