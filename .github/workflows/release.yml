name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Build release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out tag
        uses: actions/checkout@v7

      - name: Set up Temurin 26
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "26"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Verify wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Build, test, and package
        run: ./gradlew clean build installDist --no-daemon

      - name: Verify release version
        run: build/install/gitdash/bin/gitdash --version | grep -Fx "GitDash ${GITHUB_REF_NAME#v}"

      - name: Generate SHA-256 checksums
        run: |
          mkdir release-assets
          cp build/distributions/gitdash-*.tar build/distributions/gitdash-*.zip install.sh install.ps1 LICENSE release-assets/
          cd release-assets
          sha256sum gitdash-*.tar gitdash-*.zip install.sh install.ps1 LICENSE > SHA256SUMS

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          release-assets/*
          --verify-tag
          --title "GitDash ${GITHUB_REF_NAME#v}"
          --generate-notes
